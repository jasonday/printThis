<!DOCTYPE html>
<html>
<head>
    <title>printThis Test</title>
    <link rel="stylesheet" href="assets/css/normalize.css">
    <link rel="stylesheet" href="assets/css/skeleton.css">
</head>
<body>
    <div class="container">
        <h1>printThis Test Page</h1>
        <div id="test-area">
            <div id="kitty-one" class="printable">
                <h2>Kitty One</h2>
                <p>This is the first kitty.</p>
                <img src="https://placekitten.com/200/300" alt="Kitty One">
            </div>
            <p>Some content that should not be printed.</p>
            <div id="kitty-two" class="printable">
                <h2>Kitty Two</h2>
                <p>This is the second kitty.</p>
                <img src="https://placekitten.com/g/200/300" alt="Kitty Two">
            </div>
            <div id="form-area" class="printable">
                <h2>Form Area</h2>
                <form>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" value="John Doe"><br>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" value="john.doe@example.com"><br>
                    <input type="checkbox" id="subscribe" name="subscribe" checked>
                    <label for="subscribe">Subscribe to newsletter</label><br>
                    <input type="radio" id="male" name="gender" value="male" checked>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label><br>
                    <label for="country">Country:</label>
                    <select id="country" name="country">
                        <option value="usa">USA</option>
                        <option value="canada" selected>Canada</option>
                        <option value="mexico">Mexico</option>
                    </select><br>
                    <label for="comments">Comments:</label>
                    <textarea id="comments" name="comments">This is a comment.</textarea>
                </form>
            </div>
        </div>
        <button id="print-button" class="button-primary">Print</button>
    </div>
    <script src="printThis.js"></script>
    <script>
        document.getElementById('print-button').addEventListener('click', function() {
            printThis('.printable');
        });
    </script>
</body>
</html>
